<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Nitro Circuit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed canvas game, DOM menus laid over it, thumb controls pinned to the bottom corners.
   Look: night circuit, amber for action, cyan reserved for turbo. */
:root{
  --bg:#080c1a; --panel:#111833; --panel2:#18214a; --line:#2a3768;
  --fg:#eef2ff; --mute:#9aa6d4; --amber:#ffb300; --amber-ink:#2a1c00;
  --cyan:#19d3ff; --good:#43e08a; --bad:#ff5470;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#0d47a1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,12,26,.88),rgba(8,12,26,.72) 55%,rgba(8,12,26,.9));touch-action:pan-y}
.screen.clear{background:rgba(8,12,26,.55)}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.logo{font-size:clamp(40px,11vw,68px);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.03em}
.logo span{display:block;color:var(--amber)}
.tag{color:var(--mute);margin:6px 0 0;font-size:14px}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.coins{font-family:var(--display);font-weight:700;font-size:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:inset 0 0 0 3px #ffd75e;display:inline-block}
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:0;border-radius:14px;
  min-height:52px;padding:0 20px;font-size:18px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.primary{background:var(--amber);color:var(--amber-ink);box-shadow:none;min-height:64px;font-size:24px}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:10px}
.btn[disabled]{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row>div{min-width:0}
.muted{color:var(--mute);font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:38px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--mute);padding:0 10px}
.seg button.on{background:var(--amber);color:var(--amber-ink)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
.pips{display:flex;gap:4px}
.pips b{width:100%;height:8px;border-radius:2px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:block}
.pips b.on{background:var(--amber);box-shadow:none}
.upg{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.upg .pips{grid-column:1/-1}
.upg h3{color:var(--fg);font-size:17px;letter-spacing:.04em}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sw{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sw.sel{border-color:var(--amber)}
.sw canvas{width:84px;height:62px}
.sw .nm{font-family:var(--display);font-weight:600}
.stat{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.res tr.me td{color:var(--amber);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.earn{font-family:var(--display);font-size:30px;color:var(--amber);font-weight:700}
.hint{text-align:center;color:var(--mute);font-size:13px}
.flash{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:600;z-index:30}

/* ---- thumb controls ---- */
#touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:10px max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
#touch .grp{display:flex;gap:12px;pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.35);background:rgba(10,16,40,.5);
  color:#fff;border-radius:22px;font-family:var(--display);font-weight:700;font-size:22px;width:var(--cb,84px);height:var(--cb,84px);backdrop-filter:blur(2px)}
#touch button.on{background:rgba(255,179,0,.75);color:#2a1c00;border-color:#fff}
#wheelPad{display:none;pointer-events:auto;touch-action:none;width:calc(var(--cb,84px)*1.75);height:calc(var(--cb,84px)*1.75);user-select:none}
#wheelPad svg{width:100%;height:100%;display:block;pointer-events:none;transition:none}
#touch.wheel #wheelPad{display:block}#touch.wheel #bL,#touch.wheel #bR{display:none}
#touch button.horn{border-color:#ffb300;color:#ffb300;font-size:13px;width:calc(var(--cb,84px)*.78);height:calc(var(--cb,84px)*.78);border-radius:50%;align-self:center}
#touch button.horn.on{background:rgba(255,179,0,.8);color:#2a1c00}
.chatlog{max-height:150px;min-height:70px;overflow-y:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:14px;overflow-wrap:anywhere}
.cm b{color:var(--amber)}.cm.me b{color:var(--cyan)}
#touch button.turbo{border-color:var(--cyan);color:var(--cyan);font-size:15px}
#touch button.turbo.on{background:rgba(25,211,255,.8);color:#021a22}
#touch button.wide{width:calc(var(--cb,84px)*1.15);font-size:15px}
#pauseBtn{position:absolute;z-index:5;top:4px;right:max(8px,env(safe-area-inset-right,0px));
  background:rgba(10,16,40,.6);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:0 14px;height:30px;font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:13px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (orientation:landscape) and (max-height:520px){
  .wrap.home{max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;align-items:center}
}
@media (max-height:430px){.screen{padding-block:10px}.wrap{gap:10px}.btn.primary{min-height:52px}.logo{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- podium ---- */
.podium{width:100%;max-width:520px;height:auto;aspect-ratio:640/300;align-self:center}
details.card summary{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);cursor:pointer}
/* ---- splash, toasts, new cards ---- */
#splash{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(120% 90% at 50% 20%,#17214a,#080c1a 70%);transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,60px);letter-spacing:.06em;line-height:1;text-align:center}
.sp-logo span{color:var(--amber)}
.sp-by{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-size:clamp(13px,3.4vw,18px);margin-top:10px;text-align:center}
.sp-by b{color:var(--fg)}
.sp-load{width:min(320px,72vw);display:flex;flex-direction:column;gap:8px;align-items:center}
.sp-track{width:100%;height:10px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
#splashBar{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd75e);border-radius:999px}
#splashPct{font-family:var(--display);font-size:13px;color:var(--mute);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.flash.gold{background:var(--amber);color:var(--amber-ink);border-color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .btn{font-size:14px;padding:0 6px;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;border-radius:999px;min-height:38px;padding:0 14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-weight:600;font-size:14px;color:var(--mute)}
.chips button.on{background:var(--amber);color:var(--amber-ink);box-shadow:none}
.chips button.lock{opacity:.7}.chips button span{font-size:12px;opacity:.8}
.card.selc{border-color:var(--amber)}
.carc{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.carc canvas{width:96px;height:72px}
.carx{display:flex;flex-direction:column;gap:5px;min-width:0}
.barrow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.tprev{width:100%;height:auto;aspect-ratio:8/3;border-radius:10px;display:block}
.aw{font-family:var(--display);font-weight:700;color:var(--amber);white-space:nowrap}.aw.done{color:var(--good)}

/* ---- rooms ---- */
.roomcode{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,64px);letter-spacing:.22em;color:var(--amber);user-select:text;-webkit-user-select:text;padding-left:.22em}
.plr{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:16px}.tagc{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--amber);color:var(--amber-ink);border-radius:999px;padding:2px 8px}
.codein{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
/* ---- language, code box ---- */
body.ar{--display:"Cairo","Chakra Petch",system-ui,sans-serif;--body:"Cairo","Inter",system-ui,sans-serif}
body.ar .logo,body.ar .sp-logo{letter-spacing:0}
body.ar h2,body.ar h3,body.ar .sp-by{letter-spacing:0;text-transform:none}
.langs{display:flex;gap:8px}.langs button{flex:1;border:0;border-radius:999px;min-height:38px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--body);font-weight:600;font-size:14px;color:var(--mute)}
.langs button.on{background:var(--amber);color:var(--amber-ink);box-shadow:none}
input{user-select:text;-webkit-user-select:text;touch-action:auto}
.codebox{display:flex;gap:10px}.codebox input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:0 12px}
.tabs.wrapx{flex-wrap:wrap}.tabs.wrapx button{flex:1 1 30%}

.dotw{position:relative}.dot{position:absolute;top:6px;inset-inline-end:8px;width:10px;height:10px;border-radius:50%;background:#ff5252;box-shadow:0 0 0 2px var(--panel)}
.ddays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;color:var(--mute);min-width:0}
.dday b{font-family:var(--display);font-size:15px;color:var(--fg)}.dday i{font-style:normal;font-size:10px;min-height:12px;color:#43e08a}
.dday.done{opacity:.55}.dday.today{box-shadow:inset 0 0 0 2px var(--amber)}
.prow{display:flex;gap:14px;align-items:center}.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;color:#0b1020;flex:none}
.avs button{width:34px;min-height:34px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}.avs button.on{box-shadow:0 0 0 3px var(--amber)}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.stc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stc b{font-family:var(--display);font-size:20px}.stc span{font-size:12px;color:var(--mute)}
.plvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.plv{border:0;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg)}
.plv b{font-family:var(--display);font-size:22px}.plv span{font-size:13px;color:var(--amber)}.plv.lock{opacity:.5}.plv.lock span{color:var(--mute);font-size:11px}
.stars{font-size:44px;color:var(--amber);letter-spacing:6px}.stars span{opacity:.25}.earn{font-family:var(--display);font-size:22px;color:var(--amber)}
.hint{font-size:12px;color:var(--mute);text-align:center}
</style>
<div id="app">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" hidden>PAUSE</button>
  <div id="touch" hidden>
    <div class="grp"><div id="wheelPad" aria-label="Steering wheel"><svg id="wheelSvg" viewBox="-50 -50 100 100"><circle r="43" fill="rgba(10,16,40,.35)" stroke="#e8ebf2" stroke-width="7"/><circle r="43" fill="none" stroke="#2a3768" stroke-width="2" opacity=".8"/><path d="M-40 6 L-9 6 L-9 12 L-34 22 M40 6 L9 6 L9 12 L34 22 M-5 11 L-5 40 L5 40 L5 11 Z" fill="#e8ebf2" stroke="#e8ebf2" stroke-width="3" stroke-linejoin="round"/><circle r="9" fill="#ffb300"/><rect x="-5" y="-48" width="10" height="13" rx="2" fill="#ff5252"/></svg></div><button id="bL" aria-label="Steer left">&#9664;</button><button id="bHorn" class="horn">HORN</button><button id="bR" aria-label="Steer right">&#9654;</button></div>
    <div class="grp"><button id="bBrake" class="wide">BRAKE</button><button id="bTurbo" class="turbo wide">TURBO</button><button id="bGas" class="wide" hidden>GAS</button></div>
  </div>
  <div id="screen" class="screen"></div>
  <div id="splash"><div><div class="sp-logo">Nitro <span>Circuit</span></div><div class="sp-by" id="spBy">Created by <b>Yahya</b></div></div>
    <div class="sp-load"><div class="sp-track"><div id="splashBar"></div></div><div id="splashPct">0%</div></div></div>
</div>
<script>
'use strict';
/* ================= constants ================= */
const SEG_LEN = 200, LANES = 4, FOV = 100; let ROAD_W = 3000;
const CAM_DEPTH = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const CAR_Z = 1000 * CAM_DEPTH, RUMBLE = 3;
const STEP = 1 / 60, MAX_SPEED = SEG_LEN / STEP;
const ACCEL = MAX_SPEED / 5, BRAKE = -MAX_SPEED, DECEL = -MAX_SPEED / 5;
const OFFROAD_DECEL = -MAX_SPEED / 2, OFFROAD_LIMIT = MAX_SPEED / 4;

const LAT = 0.85, CAR_W_WORLD = 800; let CAR_FRAC = CAR_W_WORLD / ROAD_W, LATK = 1;

const AI_NAMES = ['Karim','Yacine','Amine','Sofiane','Nadir','Walid','Anis','Riad','Zaki','Hakim'];
const AI_COLORS = ['#e53935','#fdd835','#8e24aa','#fb8c00','#00acc1','#43a047','#f06292','#8d6e63','#cddc39','#ffffff'];

};
const THEMES = {
  coast: { name: 'Coast', blurb: 'Sunny seaside road', cost: 0, pay: 1.0,
    sky: ['#0d47a1','#1565c0','#1e88e5','#42a5f5','#64b5f6','#90caf9','#bbdefb','#e3f2fd'],
    sun: { x: 0.78, y: 0.3, r: 28, c: '#fff59d' }, m1: '#5c6bc0', m2: '#7986cb', s1: SH.peaks1, s2: SH.peaks2,
    g1: '#10aa10', g2: '#009a00', road1: '#6b6b6b', road2: '#696969', rum1: '#c62828', rum2: '#f5f5f5', lane: '#cccccc', swatch: '#42a5f5',
    fog: [220, 235, 255, 0.20],
    zones: [{ to: .40, name: 'Seaside', kinds: ['marshal', 'crowd', 'crowd', 'grand', 'palm', 'palm', 'bush', 'banner'] }, { to: .75, name: 'Marina', kinds: ['marshal', 'crowd', 'crowd', 'billboard', 'lamp', 'grand', 'bush'] }, { to: 1, name: 'Cliffs', kinds: ['marshal', 'crowd', 'crowd', 'grand', 'rock', 'bush', 'palm'] }] },
  desert: { name: 'Sahara', blurb: 'Long straights, big dunes', cost: 300, pay: 1.1,
    sky: ['#6d2f17','#a94a1b','#d9772a','#f09e44','#f7c070','#fad79b','#fce6bc','#fff1d6'],
    sun: { x: 0.28, y: 0.62, r: 42, c: '#ffe08a' }, m1: '#b5753a', m2: '#d19a5a', s1: SH.dunes1, s2: SH.dunes2,
    g1: '#e2b25e', g2: '#d3a04a', road1: '#5a524d', road2: '#564e49', rum1: '#d84315', rum2: '#fff3e0', lane: '#f5e6c8', swatch: '#e2a54a',

/* ================= weather, fog, particles, zone banner ================= */
const PART = [], DROPS = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), v: 900 + Math.random() * 500 }));
const DUSTP = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), v: 25 + Math.random() * 60, r: 1.5 + Math.random() * 3.5 }));
let fxPX = 0, fxPY = 0, fxPW = 100, lightning = 0, lightT = 6;
const SPARK = ['#ffd54f', '#ff9800', '#fff3c0'], CONFETTI = ['#ff5470', '#ffb300', '#43e08a', '#19d3ff', '#ffffff', '#b388ff'];

function emit(x, y, vx, vy, life, color, size, grav) {
  if (PART.length < 260) PART.push({ x, y, vx, vy, life, max: life, color, size, grav });
}
function drawFog() {
  const f = T.fog; if (!f) return;
  const y0 = hy - 50 * S, y1 = hy + (carY - hy) * 0.45, g = ctx.createLinearGradient(0, y0, 0, y1), m = (hy - y0) / (y1 - y0);
  const c = a => 'rgba(' + f[0] + ',' + f[1] + ',' + f[2] + ',' + a + ')';
  g.addColorStop(0, c(0)); g.addColorStop(m, c(f[3])); g.addColorStop(1, c(0));
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
}
function drawWeather() {
  const low = QUALITY[save.set.quality] < 0.7, dt = frameDt;
  if (T.weather === 'rain') {
    const n = low ? 60 : DROPS.length, len = (10 + 14 * speed / MAX_SPEED) * S;
    ctx.strokeStyle = 'rgba(205,220,240,.5)'; ctx.lineWidth = Math.max(1, S); ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const d = DROPS[i]; d.y += d.v * dt / H; d.x -= 0.05 * dt;
      if (d.y > 1) { d.y = -0.05; d.x = Math.random(); }
      const x = ((d.x % 1) + 1) % 1 * W, y = d.y * H; ctx.moveTo(x, y); ctx.lineTo(x - len * 0.18, y + len);
    }
    ctx.stroke();
    if (state !== 'paused') { lightT -= dt; if (lightT < 0) { lightning = 0.38; lightT = 7 + Math.random() * 9; } }
    if (lightning > 0) { rect(0, 0, W, H, 'rgba(235,245,255,' + (lightning * (0.6 + 0.4 * Math.sin(lightning * 40))).toFixed(3) + ')'); lightning -= dt * 1.1; }
  } else if (T.weather === 'dust') {
    const n = low ? 16 : DUSTP.length; ctx.fillStyle = T.dust; ctx.globalAlpha = 0.2;
    for (let i = 0; i < n; i++) {
      const d = DUSTP[i]; d.x -= (d.v + speed / MAX_SPEED * 140) * dt / W; if (d.x < -0.05) { d.x = 1.05; d.y = Math.random(); }
      const y = hy + 10 * S + d.y * (H - hy - 20 * S); ctx.beginPath(); ctx.ellipse(d.x * W, y, d.r * 5 * S, d.r * S, 0, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
function drawParticles() {
  const dt = frameDt, px = fxPX, py = fxPY, pw = fxPW;
  if (fx.crash) {
    for (let i = 0; i < 22; i++) emit(px + rnd(-0.3, 0.3) * pw, py - 0.3 * pw, rnd(-240, 240) * S, rnd(-320, -60) * S, rnd(0.35, 0.7), SPARK[i % 3], rnd(2, 3.5) * S, 700 * S);
    fx.crash = false;
  }
  if (state === 'play' && Math.abs(playerX) > 1 && speed > OFFROAD_LIMIT) {
    for (let i = 0; i < 2; i++) emit(px + (i ? 1 : -1) * 0.45 * pw, py - 0.05 * pw, rnd(-70, 70) * S + (i ? 40 : -40) * S, rnd(-110, -30) * S, rnd(0.35, 0.7), T.dust || T.g2, rnd(3, 7) * S, 120 * S);
  }
  if (turboOn) for (let i = 0; i < 2; i++) emit(px + (i ? 1 : -1) * 0.3 * pw, py - 0.1 * pw, rnd(-30, 30) * S, rnd(60, 170) * S, rnd(0.18, 0.3), i ? '#ff9100' : '#fff59d', rnd(2, 4) * S, 0);
  if (state === 'finished' && lastRank <= 3 && raceTime - player.finish < 8) for (let i = 0; i < 3; i++) emit(Math.random() * W, -6, rnd(-40, 40) * S, rnd(110, 220) * S, 3.2, CONFETTI[(Math.random() * 6) | 0], rnd(4, 7) * S, 0);
  for (let i = PART.length - 1; i >= 0; i--) {
    const p = PART[i]; p.life -= dt; if (p.life <= 0) { PART.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFx() { drawWeather(); drawParticles(); }
function drawZoneBanner() {
  if (zoneBanner <= 0 || state === 'paused') return;
  const a = Math.min(1, zoneBanner / 0.6, (2.6 - zoneBanner) / 0.3 + 0.001), y = 34 * S + 86 * S;
  ctx.font = '700 ' + 17 * S + 'px "Chakra Petch","Cairo",Arial,sans-serif';
  const tw = ctx.measureText(tr(zoneName).toUpperCase()).width + 36 * S;
  ctx.globalAlpha = clamp(a, 0, 1);
  rect(W / 2 - tw / 2, y - 15 * S, W / 2 + tw / 2, y + 15 * S, 'rgba(0,0,0,.6)'); rect(W / 2 - tw / 2, y + 13 * S, W / 2 + tw / 2, y + 15 * S, '#ffb300');
  tx(tr(zoneName).toUpperCase(), W / 2, y, 17 * S, '#fff', 'center');

/* ================= rear-view mirror ================= */
function drawMirror(top) {
  const mw = 132 * S, mh = 40 * S, mx = W / 2 - mw / 2, my = top, hz = my + mh * 0.38;
  ctx.save();
  ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  const sk = ctx.createLinearGradient(0, my, 0, hz); sk.addColorStop(0, T.sky[0]); sk.addColorStop(1, T.sky[T.sky.length - 1]);
  ctx.fillStyle = sk; ctx.fillRect(mx, my, mw, hz - my);
  ctx.fillStyle = T.m1; ctx.fillRect(mx, hz - mh * 0.08, mw, mh * 0.08);
  ctx.fillStyle = T.g1; ctx.fillRect(mx, hz, mw, my + mh - hz);
  const cx = mx + mw / 2 - playerX * mw * 0.06, rb = mw * 0.46, rt = mw * 0.03;
  poly(T.rum1, cx - rb * 1.1, my + mh, cx + rb * 1.1, my + mh, cx + rt * 1.1, hz, cx - rt * 1.1, hz);
  poly(T.road1, cx - rb, my + mh, cx + rb, my + mh, cx + rt, hz, cx - rt, hz);
  let near = 0;
  const behind = [];
  for (const r of racers.concat(cops)) {
    if (r.me) continue;
    const d = wrapD(player.prog - r.prog);
    if (d > 0 && d < 4200) behind.push([d, r]);
  }
  behind.sort((a, b) => b[0] - a[0]);
  for (const [d, r] of behind) {
    const k = 1 / (1 + d / 380), y = hz + (my + mh - hz) * k * 0.92, hw = rt + (rb - rt) * k;
    const x = cx + (r.offset) * hw * 0.62, w = mw * 0.34 * k + 3 * S;
    drawCar(ctx, x, y, w, r.color, String(r.kind).replace(/^F:/, ''), r.accent);
    if (d < 700) near = Math.max(near, 1 - d / 700);
  }
  if (near > 0) { ctx.fillStyle = 'rgba(255,40,60,' + (0.1 + 0.2 * near * (0.5 + 0.5 * Math.sin(performance.now() / 90))).toFixed(3) + ')'; ctx.fillRect(mx, my, mw, mh); }
  const gl = ctx.createLinearGradient(mx, my, mx + mw, my + mh); gl.addColorStop(0, 'rgba(255,255,255,.22)'); gl.addColorStop(0.35, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,.06)');
  ctx.fillStyle = gl; ctx.fillRect(mx, my, mw, mh);
  ctx.restore();
  ctx.strokeStyle = '#0c0f1c'; ctx.lineWidth = 4 * S; ctx.strokeRect(mx - 1, my - 1, mw + 2, mh + 2);
  ctx.strokeStyle = '#7d89b8'; ctx.lineWidth = 1.2; ctx.strokeRect(mx - 3 * S, my - 3 * S, mw + 6 * S, mh + 6 * S);
}

/* ================= profile, XP, daily missions, daily reward ================= */
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayNum = k => Math.floor(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)) / 86400000);
const DAILY_REWARDS = [100, 150, 200, 300, 400, 600, 1500];
const AVATARS = ['#19d3ff', '#ffb300', '#ff5252', '#43e08a', '#b388ff', '#ff80ab', '#ffffff', '#ff7043'];
const MISSIONS = [
  { id: 'races',  text: 'Finish {0} races',                t: [2, 3],     r: [90, 130] },
  { id: 'wins',   text: 'Win a race',                      t: [1, 1],     r: [140, 200] },
  { id: 'podium', text: 'Finish on the podium {0} times',  t: [2, 3],     r: [130, 190] },
  { id: 'cans',   text: 'Collect {0} turbo cans',          t: [8, 14],    r: [80, 120] },
  { id: 'coins',  text: 'Collect {0} coins on the road',   t: [20, 40],   r: [90, 140] },
  { id: 'km',     text: 'Drive {0} km in the open world',  t: [3, 6],     r: [120, 180] },
  { id: 'speed',  text: 'Reach {0} km/h',                  t: [150, 230], r: [100, 150] },
  { id: 'park',   text: 'Complete {0} parking levels',     t: [1, 2],     r: [100, 160] }
];
function ensureDaily() {
  const k = todayKey(); if (save.daily && save.daily.date === k && save.daily.list.length) return;
  const rg = mulberry(dayNum(k) * 2654435761 % 4294967296), pool = MISSIONS.slice(), list = [];
  for (let i = 0; i < 3; i++) {
    const m = pool.splice(Math.floor(rg() * pool.length), 1)[0], target = m.t[0] + Math.floor(rg() * (m.t[1] - m.t[0] + 1));
    list.push({ id: m.id, target: m.id === 'speed' ? Math.round(target / 10) * 10 : target, prog: 0, reward: Math.round((m.r[0] + rg() * (m.r[1] - m.r[0])) / 10) * 10, claimed: false });
  }
  save.daily = { date: k, list }; persist();
}
const missionText = m => tr(MISSIONS.find(x => x.id === m.id).text, m.target);
function dailyEvent(id, n, how) {
  ensureDaily();
  for (const m of save.daily.list) {
    if (m.id !== id || m.claimed || m.prog >= m.target) continue;
    m.prog = Math.min(m.target, how === 'max' ? Math.max(m.prog, n) : m.prog + n);
    if (m.prog >= m.target) { flash(tr('Mission complete: {0}', missionText(m)), true); chime(); }
  }
}
function drInfo() {
  const t = todayKey(), d = save.dr;
  if (d.last === t) return { can: false, idx: d.idx === 0 ? 7 : d.idx };
  const gap = d.last ? dayNum(t) - dayNum(d.last) : 99;
  return { can: true, idx: gap === 1 ? d.idx : 0, cont: gap === 1 };
}
function dailyDot() { ensureDaily(); return drInfo().can || save.daily.list.some(m => !m.claimed && m.prog >= m.target); }
const levelInfo = () => { const lv = Math.floor(Math.sqrt(save.xp / 60)) + 1, lo = 60 * (lv - 1) ** 2, hi = 60 * lv ** 2; return { lv, p: (save.xp - lo) / (hi - lo) }; };
function addXp(n) { const a = levelInfo().lv; save.xp += n; const b = levelInfo().lv; if (b > a) { flash(tr('Level up! Level {0}', b), true); chime(); } }
const titleFor = lv => tr(lv < 3 ? 'Rookie' : lv < 6 ? 'Racer' : lv < 10 ? 'Pro' : lv < 15 ? 'Champion' : 'Legend');

  if (count > 2.5) cdVoiced = false; else if (!cdVoiced && count <= 1.3) { cdVoiced = true; try { audioInit(); playVoice('hello', 1); } catch (e) {} }

function overtakeTick() {                   /* "faaah" whenever a car drives past you */
  const now = performance.now();
  for (const r of racers) {
    if (r.me || r.oncoming) continue;
    const d = wrapD(r.prog - player.prog);
    if (r._d !== undefined && r._d < 0 && d >= 0 && r._d > -700 && d < 700 && speed > MAX_SPEED * 0.12 && now - faahT > 2500) { faahT = now; playVoice('faah', 0.9); }
    r._d = d;
  }
}

  phantom: { t: 'triangle', t2: 'sawtooth', lo: 88,  rg: 120, gs: 16, m2: 1.5, lp: 700, lpk: 2000, g: 0.028, gk: 0.040, wf: 1200, wk: 2200, wv: 0.016 },
  viper:   { t: 'sawtooth', t2: 'square',   lo: 96,  rg: 140, gs: 20, m2: 2,   lp: 800, lpk: 2200, g: 0.026, gk: 0.040, wf: 1400, wk: 1400, wv: 0.006 },
  cobra:   { t: 'square',   t2: 'sawtooth', lo: 62,  rg: 90,  gs: 14, m2: 0.5, lp: 460, lpk: 1400, g: 0.032, gk: 0.046, wf: 1000, wk: 800,  wv: 0, trem: 17 },
  ghost:   { t: 'sawtooth', t2: 'triangle', lo: 140, rg: 200, gs: 28, m2: 2,   lp: 1300, lpk: 3200, g: 0.024, gk: 0.038, wf: 2100, wk: 2600, wv: 0.018 }
};
const engProf = () => ENG[curCar().id] || ENG.gt;
function revPreview() {                     /* short rev when you pick a car in the garage */
  if (!actx || !save.set.sfx) return; const P = engProf(), t = actx.currentTime;
  const g = actx.createGain(), lp = actx.createBiquadFilter(), a = actx.createOscillator(), b = actx.createOscillator();
  a.type = P.t; b.type = P.t2; lp.type = 'lowpass'; lp.frequency.setValueAtTime(P.lp, t); lp.frequency.linearRampToValueAtTime(P.lp + P.lpk * 0.8, t + 0.9);
  const f0 = P.lo, f1 = P.lo + P.rg * 0.9 + P.gs * 2;
  a.frequency.setValueAtTime(f0, t); a.frequency.exponentialRampToValueAtTime(f1, t + 0.9); b.frequency.setValueAtTime(f0 * P.m2, t); b.frequency.exponentialRampToValueAtTime(f1 * P.m2, t + 0.9);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((P.g + P.gk) * 1.6, t + 0.12); g.gain.setValueAtTime((P.g + P.gk) * 1.6, t + 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
  a.connect(lp); b.connect(lp); lp.connect(g); g.connect(sfxBus || master); a.start(t); b.start(t); a.stop(t + 1.3); b.stop(t + 1.3);
}

/* ================= on-screen steering wheel ================= */
let wheelVal = 0, wheelAng = 0, wheelHeld = false, wheelLast = 0;
(function () {
  const pad = document.getElementById('wheelPad'), svg = document.getElementById('wheelSvg'); if (!pad) return;
  const ang = e => { const r = pad.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (_) {} wheelHeld = true; wheelLast = ang(e); });
  pad.addEventListener('pointermove', e => {
    if (!wheelHeld) return; const a = ang(e); let d = a - wheelLast; if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
    wheelLast = a; wheelAng = clamp(wheelAng + d, -1.75, 1.75);                    /* about 100 degrees each way */
  });
  const up = e => { wheelHeld = false; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => pad.addEventListener(t, up)); pad.addEventListener('contextmenu', e => e.preventDefault());
  window.wheelTick = function (dt) {
    if (!wheelHeld) wheelAng *= Math.max(0, 1 - 9 * Math.min(dt, 0.05));          /* springs back to centre */
    if (Math.abs(wheelAng) < 0.003) wheelAng = 0;
    wheelVal = clamp(wheelAng / 1.15, -1, 1); if (Math.abs(wheelVal) < 0.04) wheelVal = 0;
    if (save.set.drive === 'wheel') svg.style.transform = 'rotate(' + (wheelAng * 57.3).toFixed(1) + 'deg)';
  };
})();
function wheelTick(dt) { }


/* ================= actions ================= */
function flash(msg, gold) {
  const host = document.getElementById('app');
  const d = document.createElement('div'); d.className = 'flash' + (gold ? ' gold' : ''); d.textContent = msg;
  const n = host.querySelectorAll('.flash').length; d.style.top = (14 + n * 9) + '%';
  host.appendChild(d); setTimeout(() => d.remove(), gold ? 2600 : 1600);
}
let backTo = 'home';
function applyCar() { if (player) { player.color = paintColor(); player.kind = curCar().kind; player.accent = curCar().accent; } }
function changeTrack(id) {
  save.set.track = id; persist();
  if (state === 'menu') { loadTrack(id); position = 0; playerX = 0; makeRacers(false); player.prog = 0; }
}
function act(a) {
  const [name, p1, p2] = a.split('|');
  if (name === 'play') { startRace(); if (policeOn) setTimeout(() => flash(tr('POLICE CHASE! Escape and win the race'), true), 3300); }
  else if (name === 'resume') togglePause();
  else if (name === 'restart') { if (mode === 'park') startPark(pk.n); else if (mode === 'world') startWorld(); else startRace(); }
  else if (name === 'world') startWorld();
  else if (name === 'mp') { backTo = 'home'; net.err = ''; showScreen('mp'); }
  else if (name === 'mpcreate') { save.name = cleanName((document.getElementById('nameIn') || {}).value); persist(); netCreate(); }
  else if (name === 'mpjoin') { save.name = cleanName((document.getElementById('nameIn') || {}).value); persist(); netJoin((document.getElementById('joinIn') || {}).value); }
  else if (name === 'mpleave') { netLeave(false); showScreen('mp'); }
  else if (name === 'mptrack') { net.cfg.track = p1; netLobby(); lobbyRefresh(true); }
  else if (name === 'mplaps') { net.cfg.laps = +p1; netLobby(); lobbyRefresh(true); }
  else if (name === 'mplevel') { net.cfg.level = p1; netLobby(); lobbyRefresh(true); }
  else if (name === 'mppolice') { net.cfg.police = p1 === '1'; netLobby(); lobbyRefresh(true); }
  else if (name === 'chatsend') chatSend();
  else if (name === 'mpstart') netStart();
  else if (name === 'mplobby') toLobby();
  else if (name === 'menu') enterMenu();
  else if (name === 'park') startPark(+p1);
  else if (name === 'parkmenu') { mode = 'race'; state = 'menu'; parkUI(false); setPlayUI(false); backTo = 'home'; showScreen('parking'); }
  else if (name === 'drclaim') { const i = drInfo(); if (i.can) { save.coins += DAILY_REWARDS[i.idx]; save.stats.earned += DAILY_REWARDS[i.idx]; save.dr = { last: todayKey(), idx: (i.idx + 1) % 7, streak: i.cont ? save.dr.streak + 1 : 1 }; addXp(20); chime(); persist(); showScreen('daily'); } }
  else if (name === 'dclaim') { ensureDaily(); const m = save.daily.list[+p1]; if (m && !m.claimed && m.prog >= m.target) { m.claimed = true; save.coins += m.reward; save.stats.earned += m.reward; addXp(15); chime(); persist(); showScreen('daily'); } }
  else if (name === 'pname') { save.name = cleanName((document.getElementById('pnameIn') || {}).value); persist(); flash(tr('Saved')); showScreen('profile'); }
  else if (name === 'avatar') { save.avatar = p1; persist(); showScreen('profile'); }
  else if (name === 'go') { backTo = (state === 'paused' || state === 'parkpaused') ? 'pause' : state === 'finished' ? 'result' : 'home'; showScreen(p1); }
  else if (name === 'back') { if (curScreen === 'mp' && net.status) netLeave(false); showScreen(backTo); }
  else if (name === 'tab') { shopTab = p1; showScreen('shop'); }
  else if (name === 'track') {
    if (save.tracks.includes(p1)) { changeTrack(p1); showScreen('home'); }
    else { shopTab = 'trk'; backTo = 'home'; showScreen('shop'); flash(tr('{0} is locked', tr(THEMES[p1].name))); }
  }
  else if (name === 'trk') {
    const t = THEMES[p1];
    if (!save.tracks.includes(p1)) { if (save.coins < price(t.cost)) return; save.coins -= price(t.cost); save.tracks.push(p1); flash(tr('{0} unlocked', tr(t.name)), true); chime(); checkAch(); }
    changeTrack(p1); persist(); showScreen('shop');
  }
  else if (name === 'car') {
    const c = CARS.find(x => x.id === p1);
    if (!save.cars.includes(p1)) { if (save.coins < price(c.cost)) return; save.coins -= price(c.cost); save.cars.push(p1); flash(tr('{0} bought', tr(c.name)), true); chime(); }
    save.car = p1; persist(); applyCar(); checkAch(); showScreen('shop'); try { audioInit(); revPreview(); } catch (e) {}
  }
  else if (name === 'set') {
    const cur = save.set[p1]; let v = p2;
    if (v === 'true') v = true; else if (v === 'false') v = false; else v = Number.isNaN(+v) ? v : +v;
    if (cur === v) return;
    save.set[p1] = v; persist();
    if (p1 === 'quality' || p1 === 'ctrl') resize();
    if ((p1 === 'sfx' || p1 === 'music') && v) audioInit();
    if (p1 === 'level') { D = DIFFICULTY[v]; }
    if (p1 === 'lang') applyLang();
    if (p1 === 'autoGas') { document.getElementById('bGas').hidden = v; resize(); }
    showScreen(curScreen);
  }
  else if (name === 'up') {
    const l = up(p1), cost = price(UP_COST[l]);
    if (l < UP_MAX && save.coins >= cost) { save.coins -= cost; save.up[p1] = l + 1; persist(); beep(660, 0.12); flash(tr('{0} level {1}', tr(UPGRADES.find(u => u.id === p1).name), l + 1)); checkAch(); showScreen('shop'); }
  }
  else if (name === 'paint') {
    const p = PAINTS.find(x => x.id === p1);
    if (!save.owned.includes(p1)) { if (save.coins < price(p.cost)) return; save.coins -= price(p.cost); save.owned.push(p1); flash(tr('{0} unlocked', tr(p.name))); }
    save.paint = p1; persist(); applyCar(); showScreen('shop');
  }
  else if (name === 'code') {
    const v = ((document.getElementById('codeIn') || {}).value || '').trim().toLowerCase();
    if (v === 'yahyaa') {
      save.free = true; TRACK_IDS.forEach(id => { if (!save.tracks.includes(id)) save.tracks.push(id); });
      CARS.forEach(c => { if (!save.cars.includes(c.id)) save.cars.push(c.id); });
      PAINTS.forEach(p => { if (!save.owned.includes(p.id)) save.owned.push(p.id); });
      UPGRADES.forEach(u => { save.up[u.id] = UP_MAX; });
      persist(); chime(); checkAch(); showScreen('shop'); flash(tr('Code accepted: everything is free'), true);
    } else flash(tr('Wrong code'));
  }
  else if (name === 'fs') {
    const el = document.documentElement;
    (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).then(() => { try { return screen.orientation.lock('landscape'); } catch (e) {} }).catch(() => flash(tr('Fullscreen is not available here')));
  }
  else if (name === 'reset') {
    if (!resetArm) { resetArm = true; clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArm = false; if (curScreen === 'settings') showScreen('settings'); }, 3000); }
    else { resetArm = false; save = defaults(); persist(); resize(); enterMenu(); flash(tr('Progress erased')); }
    showScreen('settings');
  }
}
scr.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { audioInit(); act(b.dataset.act); } });

/* ================= boot with splash ================= */
const splash = document.getElementById('splash'), splashBar = document.getElementById('splashBar'), splashPct = document.getElementById('splashPct');
let splashOn = true, splashShown = performance.now(), splashPctV = 0, splashTarget = 0;
function splashStep(p) { splashTarget = Math.max(splashTarget, p); }
function splashTick() {
  if (!splashOn) return;
  const el = performance.now() - splashShown, minShow = 2300;
  const cap = Math.min(1, el / minShow);                 /* bar never outruns the minimum display time */
  splashPctV += (Math.min(splashTarget, cap) - splashPctV) * 0.18;
  const pc = Math.round(splashPctV * 100);
  splashBar.style.width = pc + '%'; splashPct.textContent = pc + '%';
  if (splashTarget >= 1 && el >= minShow && splashPctV > 0.985) { endSplash(); return; }
  requestAnimationFrame(splashTick);
}
function endSplash() {
  splashBar.style.width = '100%'; splashPct.textContent = '100%';
  splash.classList.add('out'); setTimeout(() => { splash.hidden = true; splashOn = false; }, 450);
  splashOn = false; splashOut = true;
}
let splashOut = false;
splashTick();

loadSave(); pickLang(); applyLang(); splashStep(0.25);
bindHold(document.getElementById('bL'), 'left'); bindHold(document.getElementById('bR'), 'right');
bindHold(document.getElementById('bBrake'), 'brake'); bindHold(document.getElementById('bTurbo'), 'turbo');
bindHold(document.getElementById('bGas'), 'gas'); bindHold(document.getElementById('bHorn'), 'horn');
document.getElementById('pauseBtn').addEventListener('click', togglePause);
splashStep(0.5);
resize(); enterMenu(); splashStep(0.75);
let lastT = 0;
const errSeen = new Set();
function showErr(where, e) {                 /* never let one bad frame freeze the game; show the reason instead */
  const m = where + ': ' + (e && e.message || e); if (errSeen.has(m)) return; errSeen.add(m);
  let d = document.getElementById('errBox');
  if (!d) { d = document.createElement('div'); d.id = 'errBox'; d.style.cssText = 'position:absolute;left:8px;right:8px;top:44px;z-index:60;background:rgba(160,0,30,.92);color:#fff;font:12px/1.35 monospace;padding:8px 10px;border-radius:8px;user-select:text;-webkit-user-select:text;pointer-events:auto;direction:ltr;text-align:left'; document.getElementById('app').appendChild(d); }
  d.textContent = (d.textContent ? d.textContent + '\n' : 'Error report, send this to Yahya:\n') + m + ((e && e.stack) ? ' @ ' + String(e.stack).split('\n')[1] : '');
  d.style.whiteSpace = 'pre-wrap';
}
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now; if (!(dt > 0)) dt = 0.016; dt = Math.min(0.05, dt); frameDt = dt;
  try { update(dt); } catch (e) { showErr('update', e); }
  try { render(); } catch (e) { showErr('render', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { splashStep(1); });

/* Android back button: returns true when the game handled it */
window.__back = function () {
  if (splashOn) return true;
  if (state === 'play' || state === 'paused' || (mode === 'mp' && (state === 'countdown' || state === 'finished'))) { togglePause(); return true; }
  if (state === 'park' || state === 'parkpaused') { togglePause(); return true; }
  if (state === 'parkdone') { act('parkmenu'); return true; }
  if (state === 'countdown' || state === 'finished') { enterMenu(); return true; }
  if (curScreen === 'lobby' && !scr.hidden) { act('mpleave'); return true; }
  if (curScreen !== 'home' && !scr.hidden) { act('back'); return true; }
  return false;
};
